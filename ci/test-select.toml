# Test-selection map.
# List a path pattern here to have matching files tested.
# A file that matches no rule runs no tests.
#
# Schema:
#   [[rule]]
#   paths = ["git-path glob", ...]
#   jobs  = ["job-name", ...]
#
# Globs are matched against repo-relative paths from
#   git diff --name-only --no-renames -z BASE...HEAD
# "**" matches zero or more directories. A changed file runs the
# union of jobs from every rule whose paths it matches.
# Unknown job names are an error (enforced by ci/test_select.py).

[[rule]]
paths = [
  "verify/spin/*.pml",
  "verify/spin/run.sh",
]
jobs = ["spin"]

# tests/test_check_hygiene.py and tests/test_check_role_trailer.py
# are included by tests/**/*.py below.
[[rule]]
paths = [
  "verify/spin/run.sh",
]
jobs = ["pytest"]

[[rule]]
paths = [
  "src/**/*.py",
  "tests/**/*.py",
  "tools/**/*.py",
  "tests/fixtures/**",
  "tests/golden/**",
  "pyproject.toml",
]
jobs = ["pytest"]

[[rule]]
paths = [
  "ci/test_select.py",
  "ci/test-select.toml",
  "ci/check_dist.py",
  "ci/wheel_smoke.sh",
  ".github/workflows/release.yml",
]
jobs = ["pytest"]

[[rule]]
paths = [
  ".github/workflows/ci.yml",
]
jobs = ["pytest", "spin"]
