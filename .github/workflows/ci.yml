name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      pytest: ${{ steps.select.outputs.pytest }}
      spin: ${{ steps.select.outputs.spin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Select test jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "pytest=true" >> "$GITHUB_OUTPUT"
            echo "spin=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          if [ "$BASE" = "$ZERO" ]; then
            echo "pytest=true" >> "$GITHUB_OUTPUT"
            echo "spin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python ci/test_select.py --base "$BASE" --head "$HEAD"

  pytest:
    needs: select
    if: needs.select.outputs.pytest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: Run pytest
        run: pytest

  # Build the sdist and wheel and run the installed wheel, so a v* tag
  # (release.yml) does not find a packaging break first.
  package:
    needs: select
    if: needs.select.outputs.pytest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      - name: Check the sdist file list and the wheel contents
        run: python ci/check_dist.py dist
      - name: Smoke test the wheel
        run: |
          set -eu
          python -m venv /tmp/rco-smoke
          /tmp/rco-smoke/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/ci/wheel_smoke.sh" /tmp/rco-smoke/bin/rco

  spin:
    needs: select
    if: needs.select.outputs.spin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Spin
        run: sudo apt-get update && sudo apt-get install -y spin
      - name: Run SPIN model
        run: verify/spin/run.sh

  # Hidden-code report: a visible report of the PR (or push) diff. It is not
  # a merge gate: the scan exits 0 on findings (never --strict here). A
  # crash, a git failure, or bad arguments exits nonzero and fails the job.
  # Kept out of ci/test-select.toml on purpose: path-based selection runs
  # nothing for a file no rule lists, which is the blind spot this scan
  # covers, so it runs on every trigger.
  hidden_code_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "No usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "Root commit, nothing to compare: no hidden-code report."
            exit 0
          fi
          python3 tools/check_hidden_code.py --base "$base" --head "$head" --author "${PR_AUTHOR:-$GITHUB_ACTOR}"

  # hygiene report: identifiers, secrets, home paths, addresses, emails,
  # name tokens, typographic marks, and junk files in the commit range,
  # plus the PR title and body when the event is a pull request. report
  # only: no --strict here. a crash or git failure fails the job. kept
  # out of ci/test-select.toml on purpose so it runs on every trigger.
  hygiene_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "no usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "root commit, nothing to compare: no hygiene report."
            exit 0
          fi
          event_args=()
          if [ -n "${EVENT_PATH:-}" ] && [ -f "$EVENT_PATH" ]; then
            event_args=(--event "$EVENT_PATH")
          fi
          python3 tools/check_hygiene.py --base "$base" --head "$head" "${event_args[@]}"

  # role-trailer report: each commit in the range must carry a Role:
  # trailer naming a configured desk. report only: no --strict here.
  # a crash or git failure fails the job. kept out of the test-select
  # map so it runs on every trigger.
  role_trailer_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "no usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "root commit, nothing to compare: no role-trailer report."
            exit 0
          fi
          python3 tools/check_role_trailer.py --base "$base" --head "$head"

  # pinned-contract drift report (README roadmap, Phase 4): re-extracts
  # the files under pins/ and shows drift from the reviewed pins in the
  # job summary plus a warning annotation. a visible check, never a block:
  # exit 1 (drift) passes the job; a usage error or crash (2/3) fails it.
  # skipped in the merge queue: the PR run already reported this head.
  # kept out of ci/test-select.toml so it runs on every PR and push.
  drift_report:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          set -uo pipefail
          if [ ! -d pins ]; then
            echo "no pins/ directory: no drift report."
            exit 0
          fi
          PYTHONPATH=src python -m rco drift pins > drift.md
          code=$?
          cat drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) exit 0 ;;
            1) echo "::warning title=pinned contract drift::a pinned contract changed; see the job summary. re-pin if intended."
               exit 0 ;;
            *) exit "$code" ;;
          esac

  # cross-PR contract notice (README roadmap, Phase 5): lists other
  # open PR heads and reports which of them use a contract this head
  # changes. a visible hint, never a block: rco notice always exits 0.
  # a usage error or crash (2/3) fails the job. skipped in the merge
  # queue. kept out of ci/test-select.toml so it runs on every PR and push.
  notice_report:
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: List other open PR heads and write the notice
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: bash ci/notice_report.sh
