name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      pytest: ${{ steps.select.outputs.pytest }}
      spin: ${{ steps.select.outputs.spin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select test jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          if [ "$BASE" = "$ZERO" ]; then
            echo "pytest=true" >> "$GITHUB_OUTPUT"
            echo "spin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python ci/test_select.py --base "$BASE" --head "$HEAD"

  pytest:
    needs: select
    if: needs.select.outputs.pytest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: Run pytest
        run: pytest

  spin:
    needs: select
    if: needs.select.outputs.spin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Spin
        run: sudo apt-get update && sudo apt-get install -y spin
      - name: Run SPIN model
        run: verify/spin/run.sh
